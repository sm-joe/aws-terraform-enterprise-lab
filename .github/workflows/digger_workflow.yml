name: Digger Workflow

on:
  workflow_dispatch:
    inputs:
      run_name:
        required: false
        type: string
      spec:
        required: true
        type: string

run-name: "${{ inputs.run_name }}"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Digger
        uses: diggerhq/digger@vLatest
        with:
          digger-spec: ${{ inputs.spec }}
          setup-terraform: true
          terraform-version: "1.15.0"
          setup-aws: false
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

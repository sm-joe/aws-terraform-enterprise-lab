name: Terraform Regional Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

      aws_region:
        description: "AWS region where resources will be deployed"
        required: true
        type: choice
        options:
          - us-east-1
          - ap-south-1
          - eu-central-1
        default: us-east-1

      resource:
        description: "Terraform resource class to deploy"
        required: true
        type: choice
        options:
          - ec2
          - iam
          - s3
        default: s3

      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      auto_approve:
        description: "Automatically approve Terraform apply"
        required: true
        type: boolean
        default: false

run-name: >-
  Terraform ${{ inputs.action }} -
  ${{ inputs.environment }} -
  ${{ inputs.aws_region }} -
  ${{ inputs.resource }}

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_aws_region: ${{ inputs.aws_region }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set deployment context
        id: context
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          REGION="${{ inputs.aws_region }}"
          RESOURCE="${{ inputs.resource }}"

          TERRAFORM_DIR="environments/${ENVIRONMENT}/${RESOURCE}"
          STATE_KEY="environments/${ENVIRONMENT}/${REGION}/${RESOURCE}/terraform.tfstate"

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "resource=${RESOURCE}" >> "$GITHUB_OUTPUT"
          echo "terraform_dir=${TERRAFORM_DIR}" >> "$GITHUB_OUTPUT"
          echo "state_key=${STATE_KEY}" >> "$GITHUB_OUTPUT"

          echo "Environment : ${ENVIRONMENT}"
          echo "Region      : ${REGION}"
          echo "Resource    : ${RESOURCE}"
          echo "Terraform   : ${TERRAFORM_DIR}"
          echo "State key   : ${STATE_KEY}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-Regional

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Verify Terraform directory
        run: |
          if [ ! -d "${{ steps.context.outputs.terraform_dir }}" ]; then
            echo "ERROR: Terraform directory does not exist:"
            echo "${{ steps.context.outputs.terraform_dir }}"
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Terraform Format Check
        working-directory: ${{ steps.context.outputs.terraform_dir }}
        run: |
          terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ steps.context.outputs.terraform_dir }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="key=${{ steps.context.outputs.state_key }}"

      - name: Terraform Validate
        working-directory: ${{ steps.context.outputs.terraform_dir }}
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ steps.context.outputs.terraform_dir }}
        run: |
          terraform plan \
            -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ steps.context.outputs.terraform_dir }}
        run: |
          if [ "${{ inputs.auto_approve }}" != "true" ]; then
            echo "Terraform apply requires auto_approve=true."
            echo "Re-run the workflow with auto_approve enabled after reviewing the plan."
            exit 1
          fi

          terraform apply \
            -auto-approve \
            tfplan

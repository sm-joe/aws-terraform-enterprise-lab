name: Regional Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

      aws_region:
        description: "Target AWS region"
        required: true
        type: choice
        options:
          - us-east-1
          - ap-south-1
          - eu-central-1
        default: us-east-1

      resource:
        description: "Terraform resource class"
        required: true
        type: choice
        options:
          - ec2
          - iam
          - s3
        default: s3

      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      auto_approve:
        description: "Auto approve Terraform apply"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} - ${{ inputs.environment }} - ${{ inputs.aws_region }} - ${{ inputs.resource }}

    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_aws_region: ${{ inputs.aws_region }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-${{ inputs.environment }}

      - name: Set Terraform configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          TERRAFORM_DIR="environments/${{ inputs.environment }}/${{ inputs.resource }}"
          STATE_KEY="environments/${{ inputs.environment }}/${{ inputs.aws_region }}/${{ inputs.resource }}/terraform.tfstate"

          echo "terraform_dir=${TERRAFORM_DIR}" >> "$GITHUB_OUTPUT"
          echo "state_key=${STATE_KEY}" >> "$GITHUB_OUTPUT"

          echo "Terraform directory: ${TERRAFORM_DIR}"
          echo "Terraform state key: ${STATE_KEY}"
          echo "Deployment region: ${{ inputs.aws_region }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Terraform Init
        working-directory: ${{ steps.config.outputs.terraform_dir }}
        run: |
          terraform init -reconfigure \
            -backend-config="key=${{ steps.config.outputs.state_key }}"

      - name: Terraform Validate
        working-directory: ${{ steps.config.outputs.terraform_dir }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ steps.config.outputs.terraform_dir }}
        run: |
          terraform plan \
            -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ steps.config.outputs.terraform_dir }}
        run: |
          if [ "${{ inputs.auto_approve }}" = "true" ]; then
            terraform apply -auto-approve tfplan
          else
            terraform apply tfplan
          fi

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      confirmation:
        description: "Enter DESTROY exactly"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Destroy Request
    runs-on: ubuntu-latest

    steps:
      - name: Verify main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Destroy workflows must run from main."
            exit 1
          fi

      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "Confirmation must be exactly DESTROY."
            exit 1
          fi

  terraform-destroy-plan:
    name: Terraform Destroy Plan - ${{ inputs.environment }}
    needs: validate
    runs-on: ubuntu-latest

    # Uses your existing dev/staging/prod environment.
    # Configure required reviewers on prod/staging/dev as appropriate.
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ inputs.environment == 'dev' && 'arn:aws:iam::638631156706:role/GitHubActions-Terraform-Dev' || inputs.environment == 'staging' && 'arn:aws:iam::638631156706:role/GitHubActions-Terraform-Staging' || 'arn:aws:iam::638631156706:role/GitHubActions-Terraform-Prod' }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Destroy Plan
        working-directory: environments/${{ inputs.environment }}
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Upload Terraform destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan
          path: environments/${{ inputs.environment }}/destroy.tfplan
          retention-days: 1

  terraform-destroy-apply:
    name: Terraform Destroy Apply - ${{ inputs.environment }}
    needs: terraform-destroy-plan
    runs-on: ubuntu-latest

    # IMPORTANT:
    # This is your existing environment: dev/staging/prod.
    # The job waits here if that environment has required reviewers.
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan
          path: environments/${{ inputs.environment }}

      - name: Verify destroy plan
        working-directory: environments/${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ ! -f "destroy.tfplan" ]; then
            echo "ERROR: destroy.tfplan was not downloaded."
            echo "Directory contents:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Destroy plan successfully downloaded."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ inputs.environment == 'dev' && 'arn:aws:iam::638631156706:role/GitHubActions-Terraform-Dev' || inputs.environment == 'staging' && 'arn:aws:iam::638631156706:role/GitHubActions-Terraform-Staging' || 'arn:aws:iam::638631156706:role/GitHubActions-Terraform-Prod' }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Destroy Apply
        working-directory: environments/${{ inputs.environment }}
        run: terraform apply -auto-approve destroy.tfplan

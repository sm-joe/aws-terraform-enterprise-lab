name: Terraform Validation

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tfbackend"
      - ".tflint.hcl"
      - ".terraform-docs.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/terraform-validation.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tfbackend"
      - ".tflint.hcl"
      - ".terraform-docs.yaml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/terraform-validation.yml"

permissions:
  contents: read

jobs:
  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Find Terraform projects
        id: projects
        shell: bash
        run: |
          mapfile -t projects < <(
            find infrastructure environments modules \
              -type f \
              -name "*.tf" \
              -not -path "*/.terraform/*" \
              -printf '%h\n' |
            sort -u
          )

          printf 'Terraform projects:\n'
          printf '%s\n' "${projects[@]}"

          {
            echo 'projects<<EOF'
            printf '%s\n' "${projects[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init and Validate
        shell: bash
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue

            echo "::group::Terraform validate: $dir"
            terraform -chdir="$dir" init \
              -backend=false \
              -input=false \
              -no-color

            terraform -chdir="$dir" validate \
              -no-color
            echo "::endgroup::"
          done <<< "${{ steps.projects.outputs.projects }}"

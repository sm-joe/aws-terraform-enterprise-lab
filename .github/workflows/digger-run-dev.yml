name: Digger - Dev Workflow Test

on:
  workflow_dispatch:
    inputs:
      run_name:
        required: false
        type: string
      spec:
        required: true
        type: string

run-name: "${{ inputs.run_name }}"

permissions:
  contents: read
  security-events: write

jobs:
  compliancechicken:
    name: ComplianceChicken
    uses: sm-joe/compliancechicken/.github/workflows/compliance.yml@v1.1.0
    secrets: inherit

  digger:
    name: Digger
    needs: compliancechicken
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: write
      actions: write
      id-token: write
      pull-requests: write
      issues: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Digger-Dev

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Digger
        uses: diggerhq/digger@vLatest
        with:
          digger-spec: ${{ inputs.spec }}
          setup-terraform: true
          terraform-version: "1.15.0"
          setup-aws: false
          cache-dependencies: true
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ github.token }}

name: Digger - Dev Workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  issue_comment:
    types:
      - created

permissions:
  contents: write
  actions: write
  id-token: write
  pull-requests: write
  issues: read
  statuses: write
  security-events: write

jobs:
  terraform-compliance:
    name: Terraform Compliance
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/terraform-compliance.yml

  digger:
    name: Digger
    needs: terraform-compliance
    if: >
      always() &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, 'digger')
        )
      )
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: write
      actions: write
      id-token: write
      pull-requests: write
      issues: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Digger-Dev

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Digger
        uses: diggerhq/digger@vLatest
        with:
          no-backend: true
          disable-locking: true
          digger-filename: .digger-dev.yml
          upload-plan-destination: github
          setup-terraform: true
          terraform-version: "1.15.0"
          setup-aws: false
          cache-dependencies: true
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ github.token }}

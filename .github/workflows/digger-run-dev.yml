name: Digger - Dev Workflow

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write
  statuses: write

jobs:
  test:
    name: Digger Dispatch Test
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify
        run: |
          echo "workflow_dispatch works"
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          git status --short

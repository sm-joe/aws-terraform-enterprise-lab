name: Terraform Compliance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  terraform-compliance:
    name: Terraform Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Repository Hygiene
      # ------------------------------------------------------------

      - name: Check merge conflicts
        run: git diff --check

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            ---
            extends: relaxed
            rules:
              document-start: disable
              truthy: disable
              new-line-at-end-of-file: enable

      - name: Check JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          errors = []

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts or ".terraform" in path.parts:
                  continue

              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY

      # ------------------------------------------------------------
      # Secret Detection
      # ------------------------------------------------------------

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Terraform Quality
      # ------------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Documentation Check
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          recursive: true
          recursive-path: modules
          output-file: README.md
          output-method: inject
          git-push: false

      # ------------------------------------------------------------
      # Trivy IaC Security
      # ------------------------------------------------------------

      - name: Trivy - Infrastructure
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-infrastructure.sarif
          hide-progress: true

      - name: Upload Infrastructure SARIF
        if: always() && hashFiles('trivy-infrastructure.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-infrastructure.sarif
          category: trivy-infrastructure

      - name: Trivy - Environments
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: config
          scan-ref: environments
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-environments.sarif
          hide-progress: true
          skip-setup-trivy: true

      - name: Upload Environments SARIF
        if: always() && hashFiles('trivy-environments.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-environments.sarif
          category: trivy-environments

      - name: Trivy - Modules
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: config
          scan-ref: modules
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-modules.sarif
          hide-progress: true
          skip-setup-trivy: true

      - name: Upload Modules SARIF
        if: always() && hashFiles('trivy-modules.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-modules.sarif
          category: trivy-modules


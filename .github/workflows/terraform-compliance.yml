name: Terraform Compliance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            ---
            extends: relaxed
            rules:
              document-start: disable
              truthy: disable
              new-line-at-end-of-file: enable

      - name: Check JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          errors = []

          for path in Path(".").rglob("*.json"):
              if ".git" in path.parts or ".terraform" in path.parts:
                  continue

              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

  terraform-docs:
    name: Terraform Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform Documentation Check
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          recursive: true
          recursive-path: modules
          output-file: README.md
          output-method: inject
          git-push: false

  trivy-infrastructure:
    name: Trivy - Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: config
          scan-ref: infrastructure
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-infrastructure.sarif
          hide-progress: true

      - name: Upload SARIF
        if: always() && hashFiles('trivy-infrastructure.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-infrastructure.sarif
          category: trivy-infrastructure

  trivy-environments:
    name: Trivy - Environments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: config
          scan-ref: environments
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-environments.sarif
          hide-progress: true

      - name: Upload SARIF
        if: always() && hashFiles('trivy-environments.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-environments.sarif
          category: trivy-environments

  trivy-modules:
    name: Trivy - Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: config
          scan-ref: modules
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-modules.sarif
          hide-progress: true

      - name: Upload SARIF
        if: always() && hashFiles('trivy-modules.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-modules.sarif
          category: trivy-modules

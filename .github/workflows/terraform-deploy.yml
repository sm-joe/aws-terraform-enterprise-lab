name: Terraform Dev Deployment

on:
  push:
    branches:
      - main
    paths:
      - "modules/**/*.tf"
      - "environments/dev/**/*.tf"
      - "environments/dev/**/*.tfvars"
      - "environments/dev/**/*.tfvars.json"
      - ".github/workflows/terraform-deploy.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    name: Terraform Plan, Safety Gate and Apply - Dev
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow must run from the main branch."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Terraform-Dev

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Plan JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Terraform Safety Gate
        shell: bash
        run: |
          echo "Checking Terraform plan for resource deletions..."

          DELETE_COUNT=$(jq '
            [
              .resource_changes[]?
              | select(.change.actions | index("delete"))
            ]
            | length
          ' tfplan.json)

          echo "Resources with delete actions: ${DELETE_COUNT}"

          if [ "${DELETE_COUNT}" -gt 0 ]; then
            echo ""
            echo "Terraform Safety Gate FAILED."
            echo "The DEV deployment plan contains resource deletion(s)."
            echo ""
            echo "Resources marked for deletion:"
            jq -r '
              .resource_changes[]?
              | select(.change.actions | index("delete"))
              | " - \(.address) [\(.change.actions | join(", "))]"
            ' tfplan.json

            exit 1
          fi

          echo ""
          echo "Terraform Safety Gate PASSED."
          echo "No resource deletions detected."

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

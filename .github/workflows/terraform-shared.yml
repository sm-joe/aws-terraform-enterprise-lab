name: Terraform Shared Infrastructure

on:
  workflow_dispatch:

concurrency:
  group: terraform-shared
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-shared:
    name: Terraform Plan, Safety Gate and Apply - Shared
    runs-on: ubuntu-latest
    environment: shared

    defaults:
      run:
        working-directory: infrastructure/shared

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "This workflow must run from the main branch."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Terraform-Shared

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Plan JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Terraform Safety Gate
        shell: bash
        run: |
          echo "Checking shared infrastructure plan for deletions and replacements..."

          DELETE_COUNT=$(jq '
            [
              .resource_changes[]?
              | select(.change.actions | index("delete"))
            ]
            | length
          ' tfplan.json)

          REPLACE_COUNT=$(jq '
            [
              .resource_changes[]?
              | select(
                  (.change.actions | index("delete")) and
                  (.change.actions | index("create"))
                )
            ]
            | length
          ' tfplan.json)

          echo "Resources with delete actions: ${DELETE_COUNT}"
          echo "Resources with replacement actions: ${REPLACE_COUNT}"

          if [ "${DELETE_COUNT}" -gt 0 ]; then
            echo ""
            echo "Terraform Safety Gate FAILED."
            echo "The shared infrastructure plan contains resource deletion(s)."
            echo ""
            echo "Resources marked for deletion:"
            jq -r '
              .resource_changes[]?
              | select(.change.actions | index("delete"))
              | " - \(.address) [\(.change.actions | join(", "))]"
            ' tfplan.json

            exit 1
          fi

          if [ "${REPLACE_COUNT}" -gt 0 ]; then
            echo ""
            echo "Terraform Safety Gate FAILED."
            echo "The shared infrastructure plan contains resource replacement(s)."
            echo ""
            echo "Resources marked for replacement:"
            jq -r '
              .resource_changes[]?
              | select(
                  (.change.actions | index("delete")) and
                  (.change.actions | index("create"))
                )
              | " - \(.address) [\(.change.actions | join(", "))]"
            ' tfplan.json

            exit 1
          fi

          echo ""
          echo "Terraform Safety Gate PASSED."
          echo "No resource deletions or replacements detected."

      - name: Upload Terraform plan JSON
        uses: actions/upload-artifact@v4
        with:
          name: terraform-shared-plan-${{ github.run_number }}
          path: infrastructure/shared/tfplan.json
          retention-days: 7

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

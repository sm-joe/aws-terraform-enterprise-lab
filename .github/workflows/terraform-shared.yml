name: Terraform Shared Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-shared:
    name: Terraform Plan and Apply - Shared
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Shared infrastructure deployments must run from main."
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::638631156706:role/GitHubActions-Terraform-Shared

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: infrastructure/shared
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/shared
        run: terraform plan

      - name: Terraform Apply
        working-directory: infrastructure/shared
        run: terraform apply -auto-approve

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform Format
        entry: terraform
        language: system
        pass_filenames: false
        args:
          - fmt
          - -check
          - -recursive
        files: \.tf$

      - id: tflint-shared
        name: TFLint - Shared
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=infrastructure/shared
          - --format=compact
        files: ^infrastructure/shared/.*\.tf$

      - id: tflint-dev
        name: TFLint - Dev
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=environments/dev
          - --format=compact
        files: ^environments/dev/.*\.tf$

      - id: tflint-staging
        name: TFLint - Staging
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=environments/staging
          - --format=compact
        files: ^environments/staging/.*\.tf$

      - id: tflint-prod
        name: TFLint - Prod
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=environments/prod
          - --format=compact
        files: ^environments/prod/.*\.tf$

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.495
    hooks:
      - id: checkov
        args:
          - -d
          - .
          - --framework
          - terraform
        files: \.tf$

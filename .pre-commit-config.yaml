repos:
  # ---------------------------------------------------------------------------
  # General repository hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024

      - id: check-merge-conflict

      - id: check-yaml

      - id: check-json

      - id: end-of-file-fixer

      - id: trailing-whitespace

      - id: mixed-line-ending
        args:
          - --fix=lf

      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Secret scanning
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------------
  # Terraform - native Windows executables
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # Terraform formatting
      - id: terraform-fmt
        name: Terraform Format
        entry: terraform
        language: system
        pass_filenames: false
        args:
          - fmt
          - -check
          - -recursive
        files: \.tf$

      # TFLint - shared infrastructure
      - id: tflint-shared
        name: TFLint - Shared
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=infrastructure/shared
          - --format=compact
        files: ^infrastructure/shared/.*\.tf$

      # TFLint - dev
      - id: tflint-dev
        name: TFLint - Dev
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=environments/dev
          - --format=compact
        files: ^environments/dev/.*\.tf$

      # TFLint - staging
      - id: tflint-staging
        name: TFLint - Staging
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=environments/staging
          - --format=compact
        files: ^environments/staging/.*\.tf$

      # TFLint - prod
      - id: tflint-prod
        name: TFLint - Prod
        entry: tflint
        language: system
        pass_filenames: false
        args:
          - --chdir=environments/prod
          - --format=compact
        files: ^environments/prod/.*\.tf$

      # Checkov - repository-wide Terraform security scan
      - id: checkov
        name: Checkov
        entry: checkov
        language: system
        pass_filenames: false
        args:
          - -d
          - .
          - --framework
          - terraform
        files: \.tf$

version: 3

projects:
  - name: shared
    dir: infrastructure/shared
    autoplan:
      enabled: true
      when_modified:
        - "**/*.tf"
        - "**/*.tfvars"
        - "**/*.tfvars.json"

  - name: dev
    dir: environments/dev
    autoplan:
      enabled: true
      when_modified:
        - "**/*.tf"
        - "**/*.tfvars"
        - "**/*.tfvars.json"

  - name: staging
    dir: environments/staging
    autoplan:
      enabled: true
      when_modified:
        - "**/*.tf"
        - "**/*.tfvars"
        - "**/*.tfvars.json"

  - name: prod
    dir: environments/prod
    autoplan:
      enabled: true
      when_modified:
        - "**/*.tf"
        - "**/*.tfvars"
        - "**/*.tfvars.json"
